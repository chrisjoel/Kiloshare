name: Trigger Netlify No-Cache Build

on:
  pull_request:
    types: [closed]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    # Sécurisation des permissions du token GitHub
    permissions:
      contents: read

    # Ne s'exécute que si la PR a été fusionnée (et non simplement fermée) sur la branche master
    if: github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'master'
    
    steps:
      - name: Trigger Netlify Build with Clear Cache
        run: |
          curl -X POST "${{ secrets.NETLIFY_BUILD_HOOK }}?clear_cache=true"